<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>岗位资格考试题库</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <main class="app-layout">
        <button class="panel-toggle" id="panelToggle" type="button" aria-expanded="false" aria-controls="learningPanel">
          <span>学习面板</span><span id="panelToggleLabel">展开 ▾</span>
        </button>
        <aside class="sidebar" id="learningPanel">
          <div class="side-intro">
            <span class="section-kicker">学习面板</span>
            <p>按自己的节奏复习，系统会记住你上次看到的位置。</p>
          </div>

          <section class="mode-switch" aria-label="答题模式">
            <button class="mode-button active" data-mode="quiz" type="button">
              <span class="mode-icon">✦</span>
              <span><strong>答题模式</strong><small>选择答案并即时批改</small></span>
            </button>
            <button class="mode-button" data-mode="answer" type="button">
              <span class="mode-icon">◉</span>
              <span><strong>答案模式</strong><small>直接查看答案与解析</small></span>
            </button>
          </section>

          <section class="filter-section">
            <div class="section-heading"><span>题目分类</span><span class="mono" id="visibleCount">200</span></div>
            <div class="filter-list">
              <button class="filter-button active" data-filter="all" type="button"><span class="filter-name"><i class="filter-dot all-dot"></i>全部题目</span><span class="filter-count" data-count="all">200</span></button>
              <button class="filter-button" data-filter="single" type="button"><span class="filter-name"><i class="filter-dot single-dot"></i>单选题</span><span class="filter-count" data-count="single">100</span></button>
              <button class="filter-button" data-filter="multiple" type="button"><span class="filter-name"><i class="filter-dot multiple-dot"></i>多选题</span><span class="filter-count" data-count="multiple">32</span></button>
              <button class="filter-button" data-filter="boolean" type="button"><span class="filter-name"><i class="filter-dot boolean-dot"></i>判断题</span><span class="filter-count" data-count="boolean">68</span></button>
            </div>
          </section>

          <section class="stats-card">
            <div class="stats-card-head"><span>我的进度</span><span class="progress-percent" id="progressPercent">0%</span></div>
            <div class="progress-track"><span id="progressBar"></span></div>
            <div class="stats-grid">
              <div><strong id="completedCount">0</strong><span>已完成</span></div>
              <div><strong id="correctCount">0</strong><span>答对</span></div>
              <div><strong id="wrongCount">0</strong><span>错题</span></div>
            </div>
          </section>

          <button class="wrong-entry" id="wrongListButton" type="button">
            <span class="wrong-entry-icon">!</span>
            <span><strong>错题本</strong><small>集中复习答错的题目</small></span>
            <span class="wrong-entry-count" id="wrongEntryCount">0</span>
          </button>

          <div class="panel-actions">
            <span class="save-state"><span class="save-dot"></span><span id="saveState" role="status">进度自动保存</span></span>
            <button class="ghost-button" id="resetButton" type="button"><span class="button-icon">↺</span>重置记录</button>
          </div>

          <div class="sidebar-footer">
            <span class="source-label">题库来源</span>
            <span id="sourceName">2026 年岗位资格考试题库</span>
          </div>
        </aside>

        <section class="content-area">
          <div id="questionView"></div>
          <div id="emptyView" class="empty-view hidden">
            <div class="empty-icon">✓</div>
            <h3>这里暂时没有题目</h3>
            <p>答错的题目会自动出现在错题本中。</p>
            <button class="primary-button" id="backToAllButton" type="button">返回全部题目</button>
          </div>

          <div class="bottom-nav">
            <button class="nav-button" id="prevButton" type="button">← <span>上一题</span></button>
            <div class="keyboard-hint"><kbd>←</kbd><kbd>→</kbd> 切换题目</div>
            <button class="nav-button next" id="nextButton" type="button"><span>下一题</span> →</button>
          </div>
          <div class="bottom-tools">
            <div class="question-jump">
              <label for="questionInput">跳转题号</label>
              <input id="questionInput" type="number" min="1" step="1" inputmode="numeric" placeholder="—" />
              <button id="jumpButton" type="button">前往</button>
            </div>
            <button class="secondary-button" id="randomButton" type="button">随机抽题</button>
          </div>
        </section>
      </main>
    </div>

    <div class="modal-backdrop hidden" id="wrongModal" aria-hidden="true">
      <section class="wrong-modal" role="dialog" aria-modal="true" aria-labelledby="wrongModalTitle">
        <div class="modal-head">
          <div><p class="section-kicker">REVIEW LIST</p><h2 id="wrongModalTitle">错题本</h2></div>
          <button class="close-button" id="closeWrongButton" type="button" aria-label="关闭">×</button>
        </div>
        <p class="modal-subtitle">这里会保留你答错过的题目，点击题目即可回到练习。</p>
        <div id="wrongList" class="wrong-list"></div>
      </section>
    </div>

    <div class="toast" id="toast" role="status"></div>
    <script src="data/questions.js"></script>
    <script src="app.js"></script>
  </body>
</html>
